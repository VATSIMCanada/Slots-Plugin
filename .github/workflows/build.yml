name: Build EuroScope Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC Component
        shell: pwsh
        run: |
          Start-Process "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" `
          -ArgumentList "modify --installPath ""C:\Program Files\Microsoft Visual Studio\2022\Enterprise"" --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart" `
          -Wait

      - name: Install Dependencies via vcpkg
        # This step uses the vcpkg.json file created above
        run: |
          vcpkg integrate install
          vcpkg install --triplet x86-windows

      - name: Build Solution
        # Replace 'VATCANSitu.sln' with your actual solution filename
        run: |
          msbuild VATCANSitu.sln /p:Configuration=Release /p:Platform=x86 /p:VcpkgEnableManifest=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VATCAN-Slots-Plugin
          # Adjust the path to where your compiled .dll ends up (usually Release/)
          path: Release/*.dll