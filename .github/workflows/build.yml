name: Build EuroScope Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC and Build Tools v142  
        shell: cmd
        run: |
          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify ^
          --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" ^
          --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 ^
          --add Microsoft.VisualStudio.Component.VC.ATLMFC ^
          --add Microsoft.VisualStudio.Component.VC.v142.ATL ^
          --add Microsoft.VisualStudio.Component.VC.v142.MFC ^
          --quiet --norestart --wait

      - name: Install Dependencies via vcpkg
        # This step uses the vcpkg.json file created above
        run: |
          vcpkg integrate install
          vcpkg install --triplet x86-windows

      - name: Build Solution
        # Replace 'VATCANSitu.sln' with your actual solution filename
        run: |
          msbuild VATCANSitu.sln /p:Configuration=Release /p:Platform=x86 /p:VcpkgEnableManifest=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VATCAN-Slots-Plugin
          # Adjust the path to where your compiled .dll ends up (usually Release/)
          path: Release/*.dll