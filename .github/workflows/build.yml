name: Build EuroScope Plugin

on: 
  push:
    branches: [ "main", "2026-04-25-SSL-Update" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC and v142 Toolset
        shell: pwsh
        run: |
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          
          # This specifically adds the v142 toolset and its version of MFC/ATL
          $process = Start-Process $installer -ArgumentList 'modify', 
            '--installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"', 
            '--add Microsoft.VisualStudio.Component.VC.v142.x86.x64', 
            '--add Microsoft.VisualStudio.Component.VC.v142.MFC',
            '--add Microsoft.VisualStudio.Component.VC.v142.ATL',
            '--quiet', '--norestart' -Wait -PassThru
          
          Write-Host "Waiting for installer cleanup..."
          # Increased wait time to ensure the file system settles
          Start-Sleep -Seconds 90

      - name: Install Dependencies via vcpkg
        run: |
          vcpkg integrate install
          vcpkg install --triplet x86-windows

      - name: Build Solution
        run: |
          msbuild VATCANSitu.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v142 /p:VcpkgEnableManifest=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VATCAN-Slots-Plugin
          path: |
            Release/*.dll