name: Build EuroScope Plugin

on: 
  push:
    branches: [ "main", "2026-04-25-SSL-Update" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # This runner has VS2019 and MFC pre-installed
    runs-on: windows-2019

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # We no longer need the manual 'Install MFC' step here

      - name: Install Dependencies via vcpkg
        run: |
          vcpkg integrate install
          vcpkg install --triplet x86-windows

      - name: Build Solution
        # Using x86 to match the Solution's 32-bit configuration
        run: |
          msbuild VATCANSitu.sln /p:Configuration=Release /p:Platform=x86 /p:VcpkgEnableManifest=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VATCAN-Slots-Plugin
          path: |
            Release/*.dll